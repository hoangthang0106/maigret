# Maigret Web; Portainer LAN Stack; fork: https://github.com/hoangthang0106/maigret
# Host 18996/tcp is a CANDIDATE only. Confirm on actual VM/LXC before deployment.
services:
  maigret:
    image: soxoj/maigret:web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - maigret_reports:/app/reports
    expose:
      - "5000"
  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - maigret
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?ENTER_LAN_IP}:${MAIGRET_HOST_PORT:-18996}:80/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?ENTER_USERNAME}"
      AUTH_HASH: "${OSINT_AUTH_HASH:?ENTER_BCRYPT_HASH}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n' ':80 {' '  basic_auth {' "    $$AUTH_USER $$AUTH_HASH" '  }' '  reverse_proxy maigret:5000' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
volumes:
  maigret_reports:

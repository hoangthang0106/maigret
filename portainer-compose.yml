# Maigret Web; Portainer LAN Stack; fork: https://github.com/hoangthang0106/maigret
# Sequential 1889x OSINT LAN ports; availability is not verified until checked on Docker VM/LXC.
services:
  maigret:
    image: soxoj/maigret:web
    restart: unless-stopped
    environment:
      PORT: "18896"
    security_opt:
      - no-new-privileges:true
    volumes:
      - maigret_reports:/app/reports
  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - maigret
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?ENTER_LAN_IP}:${MAIGRET_HOST_PORT:-18896}:18896/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?ENTER_USERNAME}"
      AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?ENTER_PASSWORD_IN_PORTAINER}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        HASH=$$(caddy hash-password --algorithm bcrypt --plaintext "$$AUTH_PASSWORD")
        printf '%s\n' ':18896 {' '  basic_auth {' "    $$AUTH_USER $$HASH" '  }' '  reverse_proxy maigret:18896' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
volumes:
  maigret_reports:
